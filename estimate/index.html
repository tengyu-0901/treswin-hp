<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>TRESWIN 基幹システム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Noto+Sans+JP:wght@400;700&family=Shippori+Mincho:wght@400;600;700&display=swap">
<style>
/* Layout: 左に紺のサイドバー、右に業務画面。編集は右ドロワー、書類は紙面プレビュー。 */
:root{
  --bg:#F2F3F6; --surface:#FFFFFF; --surface-2:#F7F8FA; --ink:#16213A; --muted:#5D667A; --line:#DCE0E8;
  --navy:#1C2B4A; --navy-ink:#E9ECF3; --navy-muted:#9AA6BE; --accent:#94653A; --accent-soft:#F3EADF;
  --ok:#1F7A4D; --ok-soft:#E3F2EA; --warn:#A5660B; --warn-soft:#FBF0DC; --bad:#B23A3A; --bad-soft:#F8E4E4; --info:#2C5AA0; --info-soft:#E4ECF8;
  --paper:#FFFFFF; --paper-ink:#111111; --paper-line:#333333; --paper-sub:#555555;
  --ui:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --doc:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1420; --surface:#161D2B; --surface-2:#1B2333; --ink:#E6E9F0; --muted:#9AA3B6; --line:#2A3448;
  --navy:#0A0F19; --navy-ink:#E6E9F0; --navy-muted:#8590A8; --accent:#CF9E68; --accent-soft:#3A2C1E;
  --ok:#5CC28E; --ok-soft:#173326; --warn:#E3A549; --warn-soft:#3A2B14; --bad:#E57A7A; --bad-soft:#3B1C1F; --info:#7FA7E6; --info-soft:#1A2740;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1420; --surface:#161D2B; --surface-2:#1B2333; --ink:#E6E9F0; --muted:#9AA3B6; --line:#2A3448;
  --navy:#0A0F19; --navy-ink:#E6E9F0; --navy-muted:#8590A8; --accent:#CF9E68; --accent-soft:#3A2C1E;
  --ok:#5CC28E; --ok-soft:#173326; --warn:#E3A549; --warn-soft:#3A2B14; --bad:#E57A7A; --bad-soft:#3B1C1F; --info:#7FA7E6; --info-soft:#1A2740;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.6;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100%}
.side{background:var(--navy);color:var(--navy-ink);padding:20px 12px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh}
.brand{padding:0 8px;display:flex;flex-direction:column;gap:2px}
.brand b{font-size:17px;letter-spacing:.14em}
.brand span{font-size:11px;color:var(--navy-muted);letter-spacing:.08em}
.bars{display:flex;gap:3px;margin-top:8px}.bars i{display:block;width:18px;height:3px;background:var(--accent);opacity:.9}
.bars i:nth-child(2){opacity:.7}.bars i:nth-child(3){opacity:.5}.bars i:nth-child(4){opacity:.3}
nav{display:flex;flex-direction:column;gap:2px}
nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:6px;color:var(--navy-muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
nav button:hover{color:var(--navy-ink);background:rgba(255,255,255,.05)}
nav button[aria-current="page"]{color:var(--navy-ink);background:rgba(255,255,255,.09);box-shadow:inset 3px 0 0 var(--accent)}
nav button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
nav .cnt{font-size:11px;color:var(--navy-muted)}
.side .foot{margin-top:auto;font-size:11px;color:var(--navy-muted);padding:0 8px}
main{min-width:0;padding-block:24px 64px;padding-inline:clamp(16px,3vw,36px);display:flex;flex-direction:column;gap:20px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top h1{margin:0;font-size:22px;font-weight:700;text-wrap:balance}
.top p{margin:2px 0 0;color:var(--muted);font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:6px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible,.inp:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:12px}
.banner{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 14px;font-size:13px;color:var(--muted)}
.banner.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted);letter-spacing:.04em}
.kpi .v{font-size:24px;font-weight:700;line-height:1.2}
.kpi .v small{font-size:13px;font-weight:500;color:var(--muted);margin-left:2px}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.north{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel>h2{margin:0;font-size:14px;padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel>h2 small{font-weight:400;color:var(--muted);font-size:12px}
.panel .body{padding:14px 16px}
.flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.flow div{padding:12px 16px;border-right:1px solid var(--line);position:relative;min-width:0}
.flow div:last-child{border-right:0}
.flow b{display:block;font-size:12px;color:var(--muted);font-weight:500}
.flow span{font-size:18px;font-weight:700}
.flow em{font-style:normal;font-size:12px;color:var(--muted);margin-left:6px}
.divbar{display:flex;flex-direction:column;gap:10px}
.divbar .row{display:grid;grid-template-columns:96px minmax(0,1fr) 90px;gap:10px;align-items:center;font-size:13px}
.divbar .track{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.divbar .fill{height:100%;background:var(--accent);border-radius:4px}
.divbar .amt{text-align:right}
.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.todo li{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer}
.todo li:last-child{border-bottom:0}
.todo li .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--muted);font-size:13px;padding:22px 16px;text-align:center}
.empty b{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}
/* Tables */
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:12px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
.tbl th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl .num{text-align:right;white-space:nowrap}
.tbl .mono{font-size:12px;color:var(--muted);white-space:nowrap}
.pill{display:inline-block;font-size:11px;padding:2px 9px;border-radius:999px;white-space:nowrap;font-weight:500;background:var(--surface-2);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.info{background:var(--info-soft);color:var(--info)}
.pill.ac{background:var(--accent-soft);color:var(--accent)}
.tag{font-size:11px;color:var(--accent);border:1px solid var(--accent-soft);padding:1px 7px;border-radius:4px;white-space:nowrap}
/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(10,15,25,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--bg);z-index:21;display:flex;flex-direction:column;box-shadow:-12px 0 32px rgba(0,0,0,.18)}
.drawer header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;padding-top:calc(14px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.drawer header h3{margin:0;font-size:16px}
.drawer header .mono{font-size:12px;color:var(--muted)}
.drawer .scroll{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:18px}
.drawer footer{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;padding:12px 20px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
.drawer footer .sp{flex:1}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
legend{font-size:12px;color:var(--accent);letter-spacing:.08em;font-weight:700;margin-bottom:8px;padding:0}
.f{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.f.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.f .full{grid-column:1/-1}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 10px;font-size:14px;color:var(--ink);min-width:0}
textarea.inp{min-height:72px;resize:vertical;line-height:1.6}
.hint{font-size:12px;color:var(--muted)}
.hint.warn{color:var(--warn)}
.items{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:minmax(0,2.4fr) 64px 56px minmax(0,1.1fr) 92px 32px;gap:6px;align-items:center}
.item.head{font-size:11px;color:var(--muted)}
.item .inp{padding:6px 8px;font-size:13px}
.x{cursor:pointer;border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;padding:4px}
.x:hover{color:var(--bad)}
.totals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tot{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;font-size:13px;display:flex;flex-direction:column;gap:2px}
.tot b{font-size:18px}
.tot .row{display:flex;justify-content:space-between;color:var(--muted)}
.linkbox{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
/* Preview */
.pv{position:fixed;inset:0;z-index:30;background:rgba(10,15,25,.6);display:flex;flex-direction:column}
.pv .bar{display:flex;gap:8px;align-items:center;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.pv .bar .t{flex:1;font-weight:700;min-width:0}
.pv .stage{flex:1;overflow:auto;padding:24px 16px}
.paper-fit{width:794px;margin:0 auto;transform-origin:top center}
/* Document (A4 at 96dpi = 794px) */
.paper{width:794px;background:var(--paper);color:var(--paper-ink);font-family:var(--doc);font-size:13px;line-height:1.75;padding:64px 70px;margin:0 auto 24px;box-shadow:0 4px 24px rgba(0,0,0,.18)}
.paper.flat{box-shadow:none;margin:0}
.paper h1{font-size:24px;text-align:center;letter-spacing:.5em;margin:0 0 28px;font-weight:700;padding-left:.5em}
.paper h1.k{letter-spacing:.12em;font-size:20px;padding-left:0}
.paper .meta{display:flex;justify-content:space-between;gap:24px;margin-bottom:22px}
.paper .to{font-size:16px;border-bottom:1px solid var(--paper-line);padding-bottom:4px;min-width:280px}
.paper .from{text-align:right;font-size:12px;line-height:1.7}
.paper .from b{font-size:14px}
.paper .no{text-align:right;font-size:12px;margin-bottom:10px}
.paper .big{display:flex;align-items:baseline;gap:18px;border-bottom:2px solid var(--paper-ink);padding:6px 0;margin:6px 0 4px;width:70%}
.paper .big span{font-size:13px}
.paper .big b{font-size:22px}
.paper table{width:100%;border-collapse:collapse;margin:14px 0}
.paper th,.paper td{border:1px solid var(--paper-line);padding:6px 8px;font-size:12px}
.paper th{background:#EFEFEF;font-weight:600}
.paper td.n{text-align:right;white-space:nowrap}
.paper .sum{width:46%;margin-left:auto}
.paper .sec{font-weight:700;margin:14px 0 2px;font-size:13px}
.paper .note{font-size:12px;white-space:pre-wrap;border:1px solid var(--paper-line);padding:8px 10px;min-height:48px}
.paper .art{margin:0 0 12px;break-inside:avoid;page-break-inside:avoid}
.paper .art h4{margin:0 0 2px;font-size:13px;font-weight:700}
.paper .art p{margin:0;text-indent:0}
.paper .art p.i{padding-left:1.2em;text-indent:-1.2em}
.paper .art p.li{padding-left:2.4em;text-indent:-1.2em}
.paper .pre{margin:0 0 18px;text-indent:1em}
.paper .sig{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:28px;break-inside:avoid;page-break-inside:avoid}
.paper .sig div{font-size:12px;line-height:2.1}
.paper .sig .ln{border-bottom:1px solid var(--paper-line);display:block;min-height:24px}
.paper .stamp{display:inline-block;width:44px;height:44px;border:1px solid var(--paper-sub);border-radius:50%;text-align:center;line-height:44px;font-size:11px;color:var(--paper-sub);margin-left:8px;vertical-align:middle}
.paper .small{font-size:11px;color:var(--paper-sub)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 18px;border-radius:999px;font-size:13px;z-index:40;max-width:calc(100% - 32px)}
.drawer.wide{width:min(1360px,100%)}
.qsplit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:20px;align-items:start}
.qform{display:flex;flex-direction:column;gap:18px;min-width:0}
.qprev{position:sticky;top:0;min-width:0}
.qprev-in{width:794px;transform-origin:top left}
.qprev-in .paper{margin:0}
@media (max-width:1100px){.qsplit{grid-template-columns:minmax(0,1fr)}.qprev{position:static}}
.presets{display:flex;flex-direction:column;gap:6px}
.pgroup{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pgroup b{font-size:11px;color:var(--muted);font-weight:500;min-width:6.5em}
.pchip{cursor:pointer;font-size:12px;border:1px dashed var(--line);background:transparent;color:var(--ink);padding:3px 10px;border-radius:99px}
.pchip:hover{border-color:var(--accent);color:var(--accent)}
.paper.qdoc{font-family:"Noto Sans JP",var(--ui);font-size:12px;line-height:1.55;padding:56px 60px}
.qdoc h1{font-size:24px;letter-spacing:.6em;margin:0 0 12px;padding-left:.6em}
.qdoc .qmeta{text-align:right;font-size:11.5px}
.qdoc .qhead{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;margin:12px 0 14px}
.qdoc .qclient{font-size:17px;font-weight:700;border-bottom:1px solid var(--paper-line);padding-bottom:2px;margin-bottom:4px}
.qdoc .qbrand{display:flex;align-items:center;gap:8px;margin-bottom:4px}.qdoc .qbrand b{font-size:15px}
.qdoc .qlogo{width:34px;height:auto;display:block}
.qdoc table{width:100%;border-collapse:collapse;margin:0}
.qdoc th,.qdoc td{border:1px solid var(--paper-line);padding:4px 7px;font-size:12px}
.qdoc th{background:#E6E6E6;font-weight:700}
.qdoc .qsum th{width:28%;text-align:left}
.qdoc .qbig{font-size:18px;font-weight:700}
.qdoc .qh{font-weight:700;border-bottom:1px solid var(--paper-line);margin:14px 0 5px;padding-bottom:1px}
.qdoc .qitems td{height:23px}
.qdoc td.c{text-align:center}
.qdoc .qt{width:46%;margin-left:auto;margin-top:6px}.qdoc .qt th{text-align:left;width:55%}
.qdoc .qtots{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}.qdoc .qtots .qt{width:100%;margin:0}
.qdoc .qpre{white-space:pre-wrap;margin:0}
.settings-prod .item{grid-template-columns:minmax(0,2fr) 104px 80px 104px minmax(0,1.2fr) 32px}
@media (max-width:980px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));gap:12px;z-index:10;overflow-x:auto}
  .brand span,.bars,.side .foot,nav .cnt{display:none}
  nav{flex-direction:row}
  nav button{padding:6px 10px;white-space:nowrap}
  nav button[aria-current="page"]{box-shadow:inset 0 -2px 0 var(--accent)}
  .f,.f.c3,.totals{grid-template-columns:minmax(0,1fr)}
  .item{grid-template-columns:minmax(0,1fr) 56px 48px 80px 28px}
  .item .kind{display:none}
  .item.head span.kind{display:none}
  .flow{grid-template-columns:minmax(0,1fr)}.flow div{border-right:0;border-bottom:1px solid var(--line)}
}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
</style>
<style>/* サイト版だけで使う部品（ログイン画面など） */
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
.tw-login{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding-inline:16px}
.tw-login form{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px;width:min(360px,100%);display:flex;flex-direction:column;gap:16px}
.tw-login-brand{display:flex;flex-direction:column;gap:2px}
.tw-login-brand b{font-size:18px;letter-spacing:.14em}
.tw-login-brand span{font-size:12px;color:var(--muted);letter-spacing:.08em}
.tw-err{color:var(--bad);font-size:12px;min-height:1em;margin:0}
.tw-logout{margin:6px 8px 0;color:var(--navy-muted)!important;align-self:flex-start}
@media (max-width:760px){.tw-logout{margin:0}}
</style>
</head><body>

    <div class="brand"><b>TRESWIN</b><span>基幹システム</span><div class="bars"><i></i><i></i><i></i><i></i></div></div>

    <div class="foot" id="foot">保存先：このページの共有データベース</div>
  </aside>
  <main id="main"></main>
</div>

<script>// tres-win.com で動かすための土台。
// Claudeのアーティファクト用の window.claude.use(...) と同じ形を、
// Apps Script（データはGoogleスプレッドシート、書類はGoogleドライブ）で用意する。
(function(){
  const API_URL = 'https://script.google.com/macros/s/AKfycbyWMrvg1F03aC0a4-C3UAriMSLfNgcFojK6h9_9OkgzqLY4DOWBalhOYj83cfSYuRmezQ/exec';
  let token = '';
  try { token = sessionStorage.getItem('tw-core-token') || ''; } catch (e) {}

  // ---------- 通信 ----------
  async function api(action, payload) {
    let res;
    try {
      res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action, token }, payload || {})) });
    } catch (e) { throw { code: 'unavailable', message: 'サーバーに接続できませんでした。通信状況を確認してください。' }; }
    let data; try { data = await res.json(); } catch (e) { throw { code: 'unavailable', message: 'サーバーの応答を読めませんでした。' }; }
    if (data.ok) return data;
    if (data.error === 'auth') { showLogin('時間が経ったため、もう一度ログインしてください。'); throw { code: 'auth', message: 'ログインが必要です' }; }
    throw { code: data.error || 'tool_error', message: data.message || data.error || 'エラーが発生しました' };
  }

  // ---------- ログイン ----------
  let loggedIn; const ready = new Promise(r => { loggedIn = r; });
  function showLogin(msg) {
    token = ''; try { sessionStorage.removeItem('tw-core-token'); } catch (e) {}
    const el = document.getElementById('tw-login'); if (!el) return;
    el.hidden = false; document.getElementById('tw-pw-err').textContent = msg || '';
    const pw = document.getElementById('tw-pw'); pw.value = ''; setTimeout(() => pw.focus(), 0);
  }
  function mountLogin() {
    const box = document.createElement('div');
    box.id = 'tw-login'; box.className = 'tw-login'; box.hidden = true;
    box.innerHTML = '<form id="tw-login-form"><div class="tw-login-brand"><b>TRESWIN</b><span>基幹システム</span></div>' +
      '<label class="fld">パスワード<input class="inp" type="password" id="tw-pw" autocomplete="current-password" required></label>' +
      '<button class="btn pri" type="submit" id="tw-pw-btn">ログイン</button><p class="tw-err" id="tw-pw-err" aria-live="polite"></p></form>';
    document.body.appendChild(box);
    document.getElementById('tw-login-form').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const btn = document.getElementById('tw-pw-btn'); btn.disabled = true; document.getElementById('tw-pw-err').textContent = '';
      try {
        const r = await api('login', { password: document.getElementById('tw-pw').value });
        token = r.token; try { sessionStorage.setItem('tw-core-token', token); } catch (e) {}
        await load(); box.hidden = true; loggedIn();
      } catch (e) { document.getElementById('tw-pw-err').textContent = e.message || 'ログインできませんでした'; }
      finally { btn.disabled = false; }
    });
    const out = document.createElement('button');
    out.className = 'btn ghost sm tw-logout'; out.type = 'button'; out.textContent = 'ログアウト';
    out.onclick = async () => { try { await api('logout'); } catch (e) {} showLogin('ログアウトしました。'); location.reload(); };
    const foot = document.getElementById('foot'); if (foot) { foot.textContent = '保存先：Googleスプレッドシート'; foot.after(out); }
  }

  // ---------- データ（db と同じ使い方） ----------
  const store = new Map();          // path -> data
  const subs = new Set();           // {kind, path, next}
  const seg = p => p.split('/').filter(Boolean);
  async function load() {
    const r = await api('list');
    store.clear(); (r.docs || []).forEach(d => store.set(d.path, d.data));
    notify();
  }
  function snapDoc(path) { const d = store.get(path); return { id: seg(path).pop(), exists: d !== undefined, data: () => d === undefined ? undefined : JSON.parse(JSON.stringify(d)), metadata: { fromCache: false, hasPendingWrites: false } }; }
  function snapCol(path) {
    const n = seg(path).length + 1, docs = [];
    for (const k of store.keys()) if (k.startsWith(path + '/') && seg(k).length === n) docs.push(snapDoc(k));
    docs.sort((a, b) => a.id < b.id ? -1 : 1);
    return { docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: { fromCache: false, hasPendingWrites: false } };
  }
  function notify() { subs.forEach(s => { try { s.next(s.kind === 'doc' ? snapDoc(s.path) : snapCol(s.path)); } catch (e) { console.warn(e); } }); }
  const rid = () => Array.from(crypto.getRandomValues(new Uint8Array(10)), b => 'abcdefghijklmnopqrstuvwxyz0123456789'[b % 36]).join('');
  function docRef(path) {
    return {
      id: seg(path).pop(), path,
      async get() { return snapDoc(path); },
      async set(data) { await api('set', { path, data }); store.set(path, JSON.parse(JSON.stringify(data))); notify(); },
      async update(data) { const cur = store.get(path); if (!cur) throw { code: 'invalid_argument', message: 'not found' }; const next = Object.assign({}, cur, data); await api('set', { path, data: next }); store.set(path, next); notify(); },
      async delete() { await api('delete', { path }); store.delete(path); notify(); },
      onSnapshot(next) { const s = { kind: 'doc', path, next }; subs.add(s); setTimeout(() => next(snapDoc(path)), 0); return () => subs.delete(s); },
      collection(p) { return colRef(path + '/' + p); }
    };
  }
  function colRef(path) {
    return {
      path,
      doc(id) { return docRef(path + '/' + (id || rid())); },
      async add(data) { const r = docRef(path + '/' + rid()); await r.set(data); return r; },
      async get() { return snapCol(path); },
      onSnapshot(next) { const s = { kind: 'col', path, next }; subs.add(s); setTimeout(() => next(snapCol(path)), 0); return () => subs.delete(s); },
      where() { return this; }, orderBy() { return this; }, limit() { return this; }
    };
  }
  const db = { doc: docRef, collection: colRef };
  // 他の人の変更を拾うため、画面を開いている間は1分ごとに読み直す
  setInterval(() => { if (token && document.visibilityState === 'visible') load().catch(() => {}); }, 60000);

  // ---------- ファイル保存 ----------
  const downloads = {
    async save({ filename, data }) {
      const blob = data instanceof Blob ? data : new Blob([data]);
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 3000);
    }
  };

  // ---------- Googleドライブ（Apps Script経由） ----------
  const mcp = {
    async listTools() { return { servers: [{ server: 'Google Drive', authStatus: 'connected', tools: [{ name: 'create_file', description: '' }] }], fileArgs: false }; },
    async callTool(server, tool, input) {
      if (tool !== 'create_file') throw { code: 'not_in_manifest', message: tool };
      const r = await api('driveCreate', { input });
      return { content: [], payload: r.file };
    }
  };

  window.claude = {
    async use(name) {
      if (name === 'db') { await ready; return db; }
      if (name === 'downloads') return downloads;
      if (name === 'mcp') { await ready; return mcp; }
      return null; // user など、このサイトでは使わない機能
    }
  };

  function start() {
    mountLogin();
    if (token) load().then(loggedIn).catch(() => showLogin('')); else showLogin('');
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>

const ymd = d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

const addDays = (s,n)=>{const d=new Date(s+"T00:00:00");d.setDate(d.getDate()+Number(n||0));return ymd(d)};
const addMonths = (s,n)=>{const d=new Date(s+"T00:00:00");const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+Number(n||0));const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return ymd(d)};
const jdate = s=>{if(!s)return "　　　　年　　月　　日";const [y,m,d]=s.split("-");return `${y}年${Number(m)}月${Number(d)}日`};
const ym = s=>s?s.slice(0,7):"";

function calc(items,incl=false){
  const r={once:0,monthly:0};
  (items||[]).forEach(it=>{const v=(Number(it.qty)||0)*(Number(it.price)||0);r[it.kind==="monthly"?"monthly":"once"]+=v});
  if(incl){ // 単価が税込：合計から消費税を内訳として逆算
    r.onceTotal=r.once; r.onceTax=Math.floor(r.once*10/110); r.once=r.onceTotal-r.onceTax;
    r.monthlyTotal=r.monthly; r.monthlyTax=Math.floor(r.monthly*10/110); r.monthly=r.monthlyTotal-r.monthlyTax;
  } else {
    r.onceTax=Math.floor(r.once*TAX); r.monthlyTax=Math.floor(r.monthly*TAX);
    r.onceTotal=r.once+r.onceTax; r.monthlyTotal=r.monthly+r.monthlyTax;
  }
  return r;
}
const calcQ=q=>calc(q.items,!!q.taxIncl);

function contractEnd(c){ if(!c.startDate||!c.termMonths) return ""; return addDays(addMonths(c.startDate,c.termMonths),-1); }
function isActive(c,ref=today()){
  if(c.status!=="締結済") return false;
  if(c.startDate && c.startDate>ref) return false;
  const e=contractEnd(c); if(e && e<ref && !c.autoRenew) return false;
  return true;
}
function nextNo(col,prefix,dateStr){
  const key=prefix+"-"+(dateStr||today()).slice(2,7).replace("-","");
  let max=0; S[col].forEach(x=>{if(x.no&&x.no.startsWith(key+"-")){const n=Number(x.no.split("-").pop());if(n>max)max=n}});
  return key+"-"+String(max+1).padStart(3,"0");
}
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600)}

// ===== DB =====
async function save(col,obj){
  if(!DB){toast("このビューではデータを保存できません");throw new Error("nodb")}
  const data=clone(obj); const id=data.id; delete data.id;
  data.updatedAt=new Date().toISOString(); if(!data.createdAt) data.createdAt=data.updatedAt;
  const ref=id?DB.collection(col).doc(id):DB.collection(col).doc();
  try{ await ref.set(data); }
  catch(e){
    if(e?.code==="unavailable"){await new Promise(r=>setTimeout(r,600+Math.random()*600));await ref.set(data)}
    else{toast(e?.code==="invalid_argument"?"保存する権限がありません（編集者のみ保存できます）":e?.code==="quota_exceeded"?"保存容量の上限です。不要なデータを削除してください":"保存できませんでした："+(e?.message||e));throw e}
  }
  return ref.id;
}
async function removeDoc(col,id){ if(!DB) return; await DB.collection(col).doc(id).delete(); }

async function boot(){
  render();
  DB = await claude.use("db").catch(()=>null);
  if(!DB){S.dbState="none";render();return}
  S.dbState="ok";
  USER = await claude.use("user").catch(()=>null);
  DL = await claude.use("downloads").catch(()=>null);
  MCP = await claude.use("mcp").catch(()=>null);
  COLS.forEach(col=>{
    DB.collection(col).onSnapshot(snap=>{S[col]=snap.docs.map(d=>({id:d.id,...clone(d.data())}));S.loaded[col]=true;render()},
      e=>{S.dbState="err";render()});
  });
  DB.doc("settings/company").onSnapshot(s=>{S.company=s.exists?clone(s.data()):{};S.loaded.company=true;render()},()=>{});
}

function render(){

  // by division
  const byDiv={}; active.forEach(c=>{const d=c.division||"その他";byDiv[d]=(byDiv[d]||0)+(Number(c.monthly)||0)});
  const maxD=Math.max(1,...Object.values(byDiv));
  // todo
  const todo=[];
  sent.forEach(q=>{if(q.validUntil&&q.validUntil<t)todo.push({k:"期限超過",t:`見積 ${q.no} ${clientName(q.clientId)}：有効期限切れ`,a:`data-act="edit" data-col="quotes" data-id="${q.id}"`});else if(q.validUntil&&q.validUntil<=addDays(t,7))todo.push({k:"期限間近",t:`見積 ${q.no} ${clientName(q.clientId)}：${jdate(q.validUntil)}まで`,a:`data-act="edit" data-col="quotes" data-id="${q.id}"`})});
  S.quotes.filter(q=>q.status==="受注"&&!S.contracts.some(c=>c.quoteId===q.id)).forEach(q=>todo.push({k:"受注",t:`見積 ${q.no} ${clientName(q.clientId)}：契約書がまだありません`,a:`data-act="q2c" data-id="${q.id}"`}));
  S.contracts.filter(c=>c.status==="送付済").forEach(c=>todo.push({k:"送付済",t:`契約 ${c.no} ${clientName(c.clientId)}：締結待ち`,a:`data-act="edit" data-col="contracts" data-id="${c.id}"`}));
  unpaid.forEach(i=>{if(i.dueDate&&i.dueDate<t&&i.status==="送付済")todo.push({k:"期限超過",t:`請求 ${i.no} ${clientName(i.clientId)}：入金期限超過 ${yen(calc(i.items).onceTotal)}`,a:`data-act="edit" data-col="invoices" data-id="${i.id}"`})});
  const needBill=active.filter(c=>Number(c.monthly)>0&&!S.invoices.some(i=>i.contractId===c.id&&i.month===mon));
  if(needBill.length) todo.push({k:"未送付",t:`${jym(t)}分の月額請求が ${needBill.length} 件未作成です`,a:`data-act="go" data-v="invoices"`});
  return head("ホーム",`${jdate(t)}時点`,`<button class="btn pri" data-act="new" data-col="quotes">見積を作成</button>`)+
  `<div class="kpis">
    <div class="kpi north"><span class="l">MRR（月次経常収益）</span><span class="v">${yen(mrr)}</span><span class="s">締結済・有効な契約 ${active.length} 件の月額合計（税別）</span></div>
    <div class="kpi"><span class="l">提出中の見積</span><span class="v">${sent.length}<small>件</small></span><span class="s">見込み ${yen(sentAmt)}（月額は12ヶ月で換算）</span></div>
    <div class="kpi"><span class="l">未入金の請求</span><span class="v">${yen(unpaidAmt)}</span><span class="s">${unpaid.length} 件（税込）</span></div>
    <div class="kpi"><span class="l">受注率</span><span class="v">${rate===null?"—":rate+"<small>%</small>"}</span><span class="s">受注 ${won} ／ 失注 ${lost}・今月請求 ${yen(thisMonthBilled)}</span></div>
  </div>
  <div class="flow">
    <div><b>見積</b><span>${S.quotes.length}</span><em>提出中 ${sent.length}</em></div>
    <div><b>契約書</b><span>${S.contracts.length}</span><em>締結済 ${S.contracts.filter(c=>c.status==="締結済").length}</em></div>
    <div><b>請求</b><span>${S.invoices.length}</span><em>入金済 ${S.invoices.filter(i=>i.status==="入金済").length}</em></div>
  </div>
  <div class="grid2">
    <div class="panel"><h2>要対応<small>${todo.length} 件</small></h2><div class="body">${todo.length?`<ul class="todo">${todo.map(x=>`<li ${x.a}>${pill(x.k)}<span class="t">${esc(x.t)}</span></li>`).join("")}</ul>`:`<div class="empty">対応が必要なものはありません。</div>`}</div></div>
    <div class="panel"><h2>事業別MRR<small>税別</small></h2><div class="body">${Object.keys(byDiv).length?`<div class="divbar">${DIVS.filter(d=>byDiv[d]).map(d=>`<div class="row"><span>${d}</span><div class="track"><div class="fill" style="width:${(byDiv[d]/maxD*100).toFixed(1)}%"></div></div><span class="amt">${yen(byDiv[d])}</span></div>`).join("")}</div>`:`<div class="empty">契約書を「締結済」にすると、ここに事業別の月額が出ます。</div>`}</div></div>
  </div>`;
};

V.partners=()=>{
  const ps=S.partners;
  const rows=ps.map(p=>{
    const cl=S.clients.filter(c=>c.partnerId===p.id).map(c=>c.id);
    const cs=S.contracts.filter(c=>cl.includes(c.clientId)&&c.status==="締結済");
    const rate=(Number(p.rate)||0)/100;
    const first=cs.reduce((s,c)=>s+(Number(c.initial)||0)+(Number(c.monthly)||0),0)*rate;
    const monthly=p.basis==="継続"?cs.filter(c=>isActive(c)).reduce((s,c)=>s+(Number(c.monthly)||0),0)*rate:0;
    return `<tr data-act="edit" data-col="partners" data-id="${p.id}"><td><b>${esc(p.name)}</b></td><td class="num">${esc(p.rate||0)}%</td><td>${esc(p.basis||"初回のみ")}</td><td class="num">${cl.length}</td><td class="num">${yen(first)}</td><td class="num">${monthly?yen(monthly):"—"}</td><td>${esc(p.memo||"")}</td></tr>`}).join("");
  const inc=[...S.income].sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const y=today().slice(0,4);
  const incY=inc.filter(x=>(x.date||"").startsWith(y)).reduce((s,x)=>s+(Number(x.amount)||0),0);
  return head("紹介・代理店","紹介パートナーへの成果報酬と、当社が代理店として受け取る報酬",`<button class="btn" data-act="new" data-col="partners">紹介パートナーを追加</button><button class="btn pri" data-act="new" data-col="income">代理店報酬を記録</button>`)+
  `<div class="panel"><h2>紹介パートナー（当社が支払う）<small>顧客の「紹介元」で紐づけ</small></h2>${ps.length?`<div class="tbl-wrap" style="border:0;border-radius:0"><table class="tbl"><thead><tr><th>名前</th><th class="num">報酬率</th><th>支払方式</th><th class="num">紹介顧客</th><th class="num">初回報酬（見込み）</th><th class="num">毎月の報酬</th><th>メモ</th></tr></thead><tbody>${rows}</tbody></table></div>`:`<div class="empty">紹介パートナーはまだいません。成果報酬型のエージェントを登録すると、紹介顧客の契約額から報酬を自動計算します。</div>`}</div>
  <div class="panel"><h2>代理店報酬（当社が受け取る）<small>${y}年 合計 ${yen(incY)}</small></h2>${inc.length?`<div class="tbl-wrap" style="border:0;border-radius:0"><table class="tbl"><thead><tr><th>日付</th><th>商材・提携先</th><th>導入先</th><th class="num">報酬額</th><th>状態</th></tr></thead><tbody>${inc.map(x=>`<tr data-act="edit" data-col="income" data-id="${x.id}"><td class="mono">${esc(x.date||"")}</td><td>${esc(x.partner||"")}</td><td>${esc(x.customer||"")}</td><td class="num">${yen(x.amount)}</td><td>${pill(x.status||"見込み")}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">シャトクなど、代理店として受け取る報酬をここに記録します。</div>`}</div>`;
};

function fld(id,label,val,hint="",type="text",extra=""){
  const v=esc(val??"");
  const ctl=type==="textarea"?`<textarea class="inp" id="${id}" ${extra}>${v}</textarea>`:`<input class="inp" id="${id}" type="${type}" value="${v}" ${extra}>`;
  return `<label class="fld">${label}${ctl}${hint?`<span class="hint">${hint}</span>`:""}</label>`;
}
function sel(id,label,opts,val,extra=""){
  return `<label class="fld">${label}<select class="inp" id="${id}" ${extra}>${opts.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${String(v)===String(val??"")?"selected":""}>${esc(l)}</option>`}).join("")}</select></label>`;
}

// ===== Editors =====
const ED_TITLE={clients:"顧客",quotes:"見積",contracts:"契約書",invoices:"請求書",partners:"紹介パートナー",income:"代理店報酬"};
function defaults(col){
  const t=today(), co=S.company;
  if(col==="clients") return {kind:"法人",divisions:[]};
  if(col==="quotes") return {status:"下書き",issueDate:t,validUntil:addDays(t,co.quoteValid??30),division:"TRESLINK",items:[{name:"",qty:1,unit:"式",price:"",kind:"once"}],clientId:"",taxIncl:co.taxIncl!==false,payment:co.defPayment||"",notes:co.defNotes??DEF_NOTES,delivery:""};
  if(col==="contracts") return {status:"作成中",template:"general",division:"その他",termMonths:3,autoRenew:true,renewMonths:1,noticeDays:30,payDays:co.payDays??30,signMethod:"電子",monthly:0,initial:0,clientId:""};
  if(col==="invoices") return {status:"未送付",issueDate:t,dueDate:addDays(t,co.payDays??30),month:ym(t),items:[{name:"",qty:1,unit:"式",price:0,kind:"once"}],clientId:""};
  if(col==="partners") return {rate:10,basis:"初回のみ"};
  if(col==="income") return {date:t,partner:"マネーフォワード シャトク",status:"見込み",amount:0};
  return {};
}
function openEditor(col,id){
  const data=id?clone(byId(col,id)):defaults(col);
  if(id&&!byId(col,id)) return;
  S.ed={col,data,isNew:!id,confirmDel:false};
  renderEditor();
}
function closeEditor(){S.ed=null;$("#layer").innerHTML=""}
const B=(f,v)=>`id="e-${f}" data-b="${f}" ${v??""}`;

function itemsEditor(showKind=true){

function totalsHTML(showKind=true){
  const r=S.ed.col==="quotes"?calcQ(S.ed.data):calc(S.ed.data.items);
  const box=(t,a,tx,tt)=>`<div class="tot"><span>${t}</span><b>${yen(tt)}</b><span class="row"><span>税抜金額</span><span>${yen(a)}</span></span><span class="row"><span>消費税（10%）</span><span>${yen(tx)}</span></span></div>`;
  return `<div class="totals">${box(showKind?"一括・初期費用（税込）":"ご請求額（税込）",r.once,r.onceTax,r.onceTotal)}${showKind?box("月額（税込）",r.monthly,r.monthlyTax,r.monthlyTotal):""}</div>`;
}

function updatePreview(){
  const box=$("#qprev"); if(!box||!S.ed||S.ed.col!=="quotes") return;
  const d=S.ed.data; const shown=d.no||(quoteBase(d.issueDate)+"-01（仮）");
  box.innerHTML=docQuote({...d,no:shown});
  const w=box.parentElement.clientWidth; const sc=Math.min(1,(w-2)/794);
  box.style.transform=`scale(${sc})`; box.style.height=(box.firstElementChild.offsetHeight*sc)+"px";
}
window.addEventListener("resize",updatePreview);
function relatedHTML(cid){
  const qs=S.quotes.filter(q=>q.clientId===cid), cs=S.contracts.filter(c=>c.clientId===cid), is=S.invoices.filter(i=>i.clientId===cid);
  if(!qs.length&&!cs.length&&!is.length) return "";
  const row=(col,x,label)=>`<button class="btn sm" data-act="edit" data-col="${col}" data-id="${x.id}">${esc(x.no)} ${label}</button>`;
  return `<fieldset><legend>この顧客の書類</legend><div class="linkbox">${qs.map(q=>row("quotes",q,"見積・"+(q.status||""))).join("")}${cs.map(c=>row("contracts",c,"契約・"+(c.status||""))).join("")}${is.map(i=>row("invoices",i,"請求・"+(i.status||""))).join("")}</div></fieldset>`;
}

// ===== Save logic =====
async function saveEditor(){
  const e=S.ed; const d=clone(e.data); const col=e.col;
  if(col==="clients"&&!d.name){toast("名称を入れてください");return}
  if((col==="quotes")&&d.clientId==="__new"){
    if(!d.newClientName){toast("新しい顧客の名称を入れてください");return}
    d.clientId=await save("clients",{name:d.newClientName,kind:"法人",divisions:[d.division],person:d.contact||"",tel:d.ctel||"",email:d.cmail||""});
  }
  delete d.newClientName;
  if(["quotes","contracts","invoices"].includes(col)&&!d.clientId){toast("宛先を選んでください");return}
  if(col==="partners"&&!d.name){toast("名前を入れてください");return}
  if(col==="quotes"){ if(!d.base){d.base=quoteBase(d.issueDate);d.rev=1} d.rev=d.rev||1; d.no=quoteNo(d.base,d.rev); }
  if(!d.no){
    const pre={quotes:"Q",contracts:"C",invoices:"I"}[col];
    if(pre) d.no=nextNo(col,pre,d.issueDate||d.startDate);
  }
  if(col==="invoices"&&d.status==="入金済"&&!d.paidDate) d.paidDate=today();
  if(col==="contracts"&&d.status==="締結済"&&!d.signedDate) d.signedDate=today();
  const prevSt=d.id?byId(col,d.id)?.status:null;
  const id=await save(col,d);
  d.id=id; e.data=d; e.isNew=false; toast("保存しました");
  renderEditor();
  if(DRIVE_TRIGGER[col]&&d.status===DRIVE_TRIGGER[col]&&prevSt!==d.status&&S.company.autoDrive!==false&&MCP) driveSave(col,{...d});
  return id;
}

async function quoteToContract(qid){
  const q=(S.ed?.col==="quotes"&&S.ed.data.id===qid)?clone(S.ed.data):byId("quotes",qid);
  if(!q) return;
  if(q.status===Q_OLD){toast("旧版の見積からは契約書を作れません。最新版を開いてください");return}
  const ex=S.contracts.find(c=>c.quoteId===qid); if(ex){openEditor("contracts",ex.id);return}
  const r=calcQ(q), tpl=DIV_TPL[q.division]||"general", co=S.company;
  const nm=new Date(); nm.setMonth(nm.getMonth()+1,1);
  const start=ymd(nm);
  const c={...defaults("contracts"),template:tpl,clientId:q.clientId,quoteId:q.id,division:q.division,title:(q.title||"").replace(/の?お?見積(り|書)?$/,"")||TPL_NAME[tpl].replace("契約書",""),
    monthly:r.monthly,initial:r.once,startDate:start,payDays:co.payDays??30,
    scope:(q.items||[]).map(i=>i.name).filter(Boolean).join("\n")};
  if(tpl==="sns"){c.termMonths=3;c.autoRenew=true;c.renewMonths=1}
  if(tpl==="web"){c.termMonths=r.monthly?12:0;c.autoRenew=!!r.monthly;c.renewMonths=12;c.deliveryDate=addDays(start,60);c.payPlan="着手時50%・検収後50%"}
  if(tpl==="consult"){c.termMonths=6;c.autoRenew=true;c.renewMonths=1}
  c.no=nextNo("contracts","C");
  const id=await save("contracts",c);
  if(q.status!=="受注") await save("quotes",{...q,status:"受注"});
  toast("契約書を作成しました。内容を確認してください");
  S.ed={col:"contracts",data:{...c,id},isNew:false,confirmDel:false};
  renderEditor();
}
async function reviseQuote(){
  const e=S.ed; if(!e||e.col!=="quotes"||!e.data.id) return;
  const orig=byId("quotes",e.data.id)||e.data;
  const base=orig.base||(orig.no||"").replace(/-\d{2}$/,"")||quoteBase(orig.issueDate);
  const maxRev=Math.max(orig.rev||1,...S.quotes.filter(x=>x.base===base).map(x=>x.rev||1));
  const draft=clone(e.data);
  ["id","drive","createdAt","updatedAt"].forEach(k=>delete draft[k]);
  const t=today();
  const next={...draft,base,rev:maxRev+1,no:quoteNo(base,maxRev+1),prevNo:orig.no,status:"下書き",issueDate:t,validUntil:addDays(t,S.company.quoteValid??30)};
  const id=await save("quotes",next);
  await save("quotes",{...orig,base,rev:orig.rev||1,status:Q_OLD,supersededBy:next.no});
  const o=S.quotes.find(x=>x.id===orig.id); if(o){o.status=Q_OLD;o.base=base;o.rev=orig.rev||1}
  if(!S.quotes.some(x=>x.id===id)) S.quotes.push({...next,id});
  const c=S.contracts.find(k=>k.quoteId===orig.id);
  S.ed={col:"quotes",data:{...next,id},isNew:false,confirmDel:false}; renderEditor();

function invoiceFromContract(c,month){
  const first=!S.invoices.some(i=>i.contractId===c.id);
  const items=[];
  if(Number(c.monthly)>0) items.push({name:`${c.title||TPL_NAME[c.template].replace("契約書","")}（${jym(month+"-01")}分）`,qty:1,unit:"月",price:Number(c.monthly),kind:"once"});
  if(first&&Number(c.initial)>0) items.push({name:c.template==="web"?(c.payPlan==="着手時50%・検収後50%"?"ホームページ制作費（着手金50%）":"ホームページ制作費"):"初期費用",qty:1,unit:"式",price:c.template==="web"&&c.payPlan==="着手時50%・検収後50%"?Math.round(Number(c.initial)/2):Number(c.initial),kind:"once"});
  const t=today();
  return {status:"未送付",clientId:c.clientId,contractId:c.id,month,issueDate:t,dueDate:addDays(t,c.payDays??S.company.payDays??30),items};
}
async function contractToInvoice(cid){
  let c=byId("contracts",cid);
  if(S.ed?.col==="contracts"){const id=await saveEditor();if(!id)return;c=clone(S.ed.data);cid=id}
  if(!c) return;
  const mon=(c.startDate&&c.startDate>today())?ym(c.startDate):ym(today());
  const ex=S.invoices.find(i=>i.contractId===cid&&i.month===mon); if(ex){openEditor("invoices",ex.id);return}
  const inv=invoiceFromContract(c,mon); inv.no=nextNo("invoices","I");
  const id=await save("invoices",inv);
  S.ed={col:"invoices",data:{...inv,id},isNew:false,confirmDel:false}; renderEditor(); toast("請求書を作成しました");
}
async function bulkBill(){
  const mon=S.filter.month||ym(today());
  const list=S.contracts.filter(c=>isActive(c,mon+"-28")&&Number(c.monthly)>0&&!S.invoices.some(i=>i.contractId===c.id&&i.month===mon));
  let n=0;
  for(const c of list){const inv=invoiceFromContract(c,mon);inv.no=nextNo("invoices","I");S.invoices.push({...inv,id:"tmp"+n});await save("invoices",inv);n++}
  S.invoices=S.invoices.filter(i=>!String(i.id).startsWith("tmp"));
  toast(`${jym(mon+"-01")}分の請求書を ${n} 件作成しました`); render();
}

function fitPaper(){const f=$("#pv-fit");if(!f)return;const w=f.parentElement.clientWidth-8;const s=Math.min(1,w/794);f.style.transform=`scale(${s})`;f.style.marginBottom=s<1?`-${f.scrollHeight*(1-s)}px`:"0"}

const loaded={};
function loadScript(src){return loaded[src]||(loaded[src]=new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>{delete loaded[src];rej(new Error("load"))};document.head.appendChild(s)}))}
async function saveFile(filename,data){
  if(!DL){toast("この画面ではファイルを保存できません");return}
  try{await DL.save({filename,data});}
  catch(e){if(e?.code==="declined")return;toast(e?.code==="rate_limited"?"少し待ってからもう一度お試しください":"保存できませんでした："+(e?.message||e?.code||e))}
}
async function exportPDF(){
  const doc=S.pv; if(!doc) return;
  const btn=document.querySelector('[data-act="pdf"]'); if(btn){btn.disabled=true;btn.textContent="PDFを作成中…"}
  try{
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js");
    if(document.fonts?.ready) await document.fonts.ready;
    const host=$("#render-host"); host.innerHTML=doc.html; const el=host.firstElementChild; el.classList.add("flat");
    el.style.padding="0";el.style.width="673px";host.style.width="673px";
    const blob=await window.html2pdf().set({margin:[16,16,16,16],image:{type:"jpeg",quality:0.96},html2canvas:{scale:2,backgroundColor:"#ffffff",useCORS:true},jsPDF:{unit:"mm",format:"a4",orientation:"portrait"},pagebreak:{mode:["css","legacy"],avoid:[".art","tr",".sig",".big"]}}).from(el).outputPdf("blob");
    host.innerHTML="";
    await saveFile(doc.file+".pdf",blob);
  }catch(e){toast("PDFを作成できませんでした");console.warn(e)}
  finally{if(btn){btn.disabled=false;btn.textContent="PDFで保存"}}
}
async function exportDocx(){
  const e=S.ed; if(!e||e.col!=="contracts") return;
  const btn=document.querySelector('[data-act="docx"]'); if(btn){btn.disabled=true;btn.textContent="Wordを作成中…"}
  try{
    await loadScript("https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js");
    const D=window.docx; const M=contractModel(e.data);
    const F="游明朝";
    const P=(text,o={})=>new D.Paragraph({alignment:o.align,spacing:{after:o.after??60,line:340},indent:o.indent,children:[new D.TextRun({text,bold:o.bold,size:o.size||21,font:F})]});
    const kids=[P(M.title,{align:D.AlignmentType.CENTER,bold:true,size:32,after:360}),P(M.pre,{indent:{firstLine:210},after:240})];
    M.arts.forEach((a,i)=>{
      kids.push(P(`第${i+1}条（${a.h}）`,{bold:true,after:40}));
      const plain=a.ps.filter(x=>typeof x!=="object");
      a.ps.forEach(p=>{
        if(typeof p==="object") kids.push(P(p.li,{indent:{left:420,hanging:210}}));
        else kids.push(P((plain.length>1?(plain.indexOf(p)+1)+"　":"")+p,{indent:{left:210,hanging:210}}));
      });
      kids.push(P("",{after:80}));
    });
    kids.push(P(M.closing,{indent:{firstLine:210},after:200}),P(jdate(M.date),{after:300}));
    const party=(r,p)=>[P(r,{bold:true}),P("住所　"+(p.address||"")),P("名称　"+p.name),P((r.startsWith("乙")?"代表　":"代表者　")+(p.rep||"")+(M.paper?"　　　　　印":""),{after:240})];
    kids.push(...party("甲（委託者）",M.A),...party("乙（受託者）",M.B));
    const doc=new D.Document({styles:{default:{document:{run:{font:F,size:21}}}},sections:[{properties:{page:{margin:{top:1418,bottom:1418,left:1418,right:1418}}},children:kids}]});
    const blob=await D.Packer.toBlob(doc);
    await saveFile(currentDoc().file+".docx",blob);
  }catch(err){toast("Wordファイルを作成できませんでした");console.warn(err)}
  finally{if(btn){btn.disabled=false;btn.textContent="Wordで保存"}}
}

function inlineHTML(html){
  const host=$("#render-host"); host.innerHTML=html; const root=host.firstElementChild;
  root.querySelectorAll("*").forEach(el=>{const cs=getComputedStyle(el);el.setAttribute("style",KEEP.map(k=>[k,cs.getPropertyValue(k)]).filter(([k,v])=>v&&!/^0px none|^rgba\(0, 0, 0, 0\)|^normal$|^auto$/.test(v)&&!(v==="0px"&&k!=="text-indent")).map(([k,v])=>`${k}:${v}`).join(";")+";color:#111")});
  root.querySelectorAll(".stamp").forEach(s=>s.replaceWith("　印"));
  root.querySelectorAll("img").forEach(i=>{i.setAttribute("src",LOGO_URL_PUBLIC);i.setAttribute("width","36");i.setAttribute("height","36")});
  const out=`<html><head><meta charset="utf-8"></head><body style="font-family:'Noto Serif JP',serif;font-size:10.5pt">${root.innerHTML}</body></html>`;
  host.innerHTML=""; return out;
}
async function pdfBlob(html){
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js");
  if(document.fonts?.ready) await document.fonts.ready;
  const host=$("#render-host"); host.innerHTML=html; host.style.width="673px"; const el=host.firstElementChild; el.classList.add("flat"); el.style.padding="0"; el.style.width="673px";
  const blob=await window.html2pdf().set({margin:[16,16,16,16],image:{type:"jpeg",quality:0.96},html2canvas:{scale:2,backgroundColor:"#ffffff",useCORS:true},jsPDF:{unit:"mm",format:"a4",orientation:"portrait"},pagebreak:{mode:["css","legacy"],avoid:[".art","tr",".sig",".big"]}}).from(el).outputPdf("blob");
  host.innerHTML=""; return blob;
}
const b64=blob=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(blob)});
async function driveSave(col,rec,{quiet=false}={}){
  if(!MCP){toast("この画面ではGoogleドライブに保存できません");return false}
  if(!byId("clients",rec.clientId)) await new Promise(r=>setTimeout(r,600));
  const folder=S.company.drive?.[DRIVE_SUB[col]]||S.company.drive?.root;
  if(!folder){toast("設定でGoogleドライブの保存先フォルダを入れてください");return false}
  const prev=S.ed; S.ed={col,data:rec}; const doc=currentDoc(); S.ed=prev;
  if(!quiet) toast("Googleドライブに保存しています…");
  const stamp=new Date().toLocaleString("ja-JP",{hour12:false}).replace(/\//g,"-");
  try{
    const g=await gcreate({title:doc.file,textContent:inlineHTML(doc.html),contentMimeType:"text/html",parentId:folder});
    let pdf={};
    try{
      const blob=await pdfBlob(doc.html);
      const lt=await MCP.listTools().catch(()=>({}));
      const content=lt.fileArgs?{$file:{data:blob,name:doc.file.replace(/[^\w\-]+/g,"_")+".pdf",type:"application/pdf"}}:(blob.size<700000?await b64(blob):null);
      if(content) pdf=await gcreate({title:doc.file+".pdf",base64Content:content,contentMimeType:"application/pdf",disableConversionToGoogleType:true,parentId:folder});
    }catch(pe){console.warn("pdf",pe)}
    const log={at:new Date().toISOString(),status:rec.status||"",docUrl:g.viewUrl||"",pdfUrl:pdf.viewUrl||""};
    const cur=byId(col,rec.id)||rec;
    await save(col,{...cur,drive:[...(cur.drive||[]),log]});
    if(S.ed&&S.ed.col===col&&S.ed.data.id===rec.id){S.ed.data.drive=[...(S.ed.data.drive||[]),log];renderEditor()}
    toast(pdf.viewUrl?"Googleドライブに保存しました（ドキュメント＋PDF）":"Googleドライブに保存しました（ドキュメント）");
    return true;
  }catch(e){toast(driveErr(e));console.warn(e);return false}
}
function driveLogHTML(d){
  const ls=d.drive||[]; if(!ls.length) return "";
  return `<fieldset><legend>Googleドライブの保存履歴</legend><div class="items">${ls.slice().reverse().map(l=>`<div class="linkbox"><span class="mono">${esc(new Date(l.at).toLocaleString("ja-JP",{hour12:false}))}</span>${l.status?pill(l.status):""}${l.docUrl?`<a href="${esc(l.docUrl)}" target="_blank" rel="noopener">ドキュメント</a>`:""}${l.pdfUrl?`<a href="${esc(l.pdfUrl)}" target="_blank" rel="noopener">PDF</a>`:""}</div>`).join("")}</div></fieldset>`;
}
async function exportLedger(){
  if(!MCP){toast("この画面ではGoogleドライブに保存できません");return}
  const folder=S.company.drive?.ledger||S.company.drive?.root;
  if(!folder){toast("設定で台帳の保存先フォルダを入れてください");return}
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const rows=[["種類","番号","日付","顧客","件名・業務","事業","状態","一括・初期（税別）","月額（税別）","合計（税込）","最新のドライブ保存"]];
  const last=x=>{const l=(x.drive||[]).slice(-1)[0];return l?(l.docUrl||""):""};
  S.quotes.forEach(x=>{const r=calcQ(x);rows.push(["見積",x.no,x.issueDate,clientName(x.clientId),x.title,x.division,x.status,r.once,r.monthly,r.onceTotal+r.monthlyTotal,last(x)])});
  S.contracts.forEach(x=>rows.push(["契約",x.no,x.signedDate||x.startDate,clientName(x.clientId),x.title,x.division,x.status,Number(x.initial)||0,Number(x.monthly)||0,"",last(x)]));
  S.invoices.forEach(x=>{const r=calc(x.items);rows.push(["請求",x.no,x.issueDate,clientName(x.clientId),x.month?jym(x.month+"-01")+"分":"","",x.status,r.once,"",r.onceTotal,last(x)])});
  const csv=rows.map(r=>r.map(q).join(",")).join("\n");
  const d=new Date(); const name=`TRESWIN台帳_${ymd(d).replace(/-/g,"")}-${pad(d.getHours())}${pad(d.getMinutes())}`;
  toast("台帳を書き出しています…");
  try{const f=await gcreate({title:name,textContent:csv,contentMimeType:"text/csv",parentId:folder});
    const c={...S.company,lastLedger:{at:d.toISOString(),url:f.viewUrl||""}};await DB.doc("settings/company").set(c);
    toast("台帳をGoogleスプレッドシートに書き出しました");
  }catch(e){toast(driveErr(e))}
}

boot();
